            - heading "Questions ? Answers." [level=1] [ref=e827]
            - generic [ref=e828]:
              - generic [ref=e833]:
                - paragraph [ref=e839] [cursor=pointer]: Do I need a software to edit these templates ?
                - paragraph [ref=e842]: These templates run on Framer and are built to edit as easily as filling out a simple form — most people finish everything in under 10 minutes.
              - generic [ref=e847]:
                - paragraph [ref=e853] [cursor=pointer]: What is Framer ?
                - paragraph [ref=e856]: Framer is a free, easy-to-use website builder—no coding needed. Just drag, drop, and publish a stunning site in minutes.
              - generic [ref=e861]:
                - paragraph [ref=e867] [cursor=pointer]: Will this open like a website ?
                - paragraph [ref=e870]: "Yes. Once published your guests will be able to see your invite like a dynamic website: Interactable, complete with links to venue location, RSVP, and wedding Instagram."
              - generic [ref=e875]:
                - paragraph [ref=e881] [cursor=pointer]: What if I want to split guests by event ?
                - paragraph [ref=e884]: The template has an easy provision to create as many event combinations as you need. That way you'll be able to call separate guests to separate events.
              - generic [ref=e889]:
                - paragraph [ref=e895] [cursor=pointer]: How do I get started ?
                - paragraph [ref=e898]: We provide an 8 minute+ tutorial video to get you started. In brief - You can start with just a computer. Click the template link in your email after purchase—Then click on the tutorial video link in from the same email and simply follow the steps. Sign up, add your photos and text, and hit publish. It’s all free and fully editable—anytime & anywhere.
              - generic [ref=e903]:
                - paragraph [ref=e909] [cursor=pointer]: How long does it take to edit the invite ?
                - paragraph [ref=e912]: Editing and sharing is super simple—just like filling a form. Add names, family details, events, photos, and links, and you’re ready to go. Most couples finish in just 10–20 minutes.
              - generic [ref=e917]:
                - paragraph [ref=e923] [cursor=pointer]: What happens after I buy the template?
                - paragraph [ref=e926]: After you buy a template, you’ll get a “Remix” link by email. Click it to open the template in Framer. Sign up for a free account, and the template will be added to your workspace—ready to customize.
              - generic [ref=e931]:
                - paragraph [ref=e937] [cursor=pointer]: Can I purchase now and use it later ?
                - paragraph [ref=e940]: Yes. You can purchase now and use it anytime in the future.
              - generic [ref=e945]:
                - paragraph [ref=e951] [cursor=pointer]: Can I purchase it using my phone ?
                - paragraph [ref=e954]: Yes. You can purchase the template from any device and edit it on laptop using the link which will be sent to you on your email.
              - generic [ref=e959]:
                - paragraph [ref=e965] [cursor=pointer]: Is there an expiry to the template ?
                - paragraph [ref=e968]: Once you complete your purchase, you’ll have lifetime access.
              - generic [ref=e973]:
                - paragraph [ref=e979] [cursor=pointer]: Will I need to buy a domain name ?
                - paragraph [ref=e982]: "Short Answer: No need. Framer gives you a free web link (like anshwedsneha.framer.website). But if you want your own .com, that’s optional."
              - generic [ref=e987]:
                - paragraph [ref=e993] [cursor=pointer]: How do I add my details in the template?
                - paragraph [ref=e996]: Simply follow the step-by-step video guide included with your purchase. In short—click on any text to edit, or on a photo to upload your own. That’s it!
              - generic [ref=e1001]:
                - paragraph [ref=e1007] [cursor=pointer]: Can I add music ?
                - paragraph [ref=e1010]: YES - The template allows you to add any music of your choice as an .MP3 file
              - generic [ref=e1015]:
                - paragraph [ref=e1021] [cursor=pointer]: What's included in the template ?
                - paragraph [ref=e1024]: "- Tutorial: Step-by-step video guide for easy editing - Event Cards: Customisable cards for bride & groom families - Custom Pages: Separate invite pages for each event - Photo Highlight: Showcase your pre-wedding shoot beautifully - Instant Edits: Update anytime, even after sharing - Smart Links: Built-in RSVP, venue maps & Instagram updates - Accessibility: Elder-friendly, no tiny text like WhatsApp videos - Information: Space for hashtag, parking, staff stay & more - Animations: Smooth scrolling effects to bring invites alive - God Motif: Lord Ganesha motif with an editable mantra option - Responsive: Works on laptop, tablet & phone seamlessly - Music: Upload any muisc of your choice"
              - generic [ref=e1029]:
                - paragraph [ref=e1035] [cursor=pointer]: Do I need to know coding to use this?
                - paragraph [ref=e1038]: "Short Answer: Not at all. If you can use Canva or Instagram, you’ll find Framer as easy."
              - generic [ref=e1043]:
                - paragraph [ref=e1049] [cursor=pointer]: How do I share this with my guests?
                - paragraph [ref=e1052]: "Short Answer: Once done, you get a simple link. Share it on WhatsApp, text, email — anything works."
              - generic [ref=e1057]:
                - paragraph [ref=e1063] [cursor=pointer]: How do my guests view the invite ?
                - paragraph [ref=e1066]: Like they view any website—on their phone's browser, Safari, Chrome or whatever. It opens beautifully like a website on any device.
              - generic [ref=e1071]:
                - paragraph [ref=e1077] [cursor=pointer]: Can I preview before I share it ?
                - paragraph [ref=e1080]: "Short Answer: Yes! Framer lets you preview everything on mobile and desktop before going live."
              - generic [ref=e1085]:
                - paragraph [ref=e1091] [cursor=pointer]: Can I make changes after sharing ?
                - paragraph [ref=e1094]: "Short Answer: Absolutely. Change anything — venue, timings, any link — even after it’s published, and it updates for everyone instantly, no need to re-share the invite."
              - generic [ref=e1099]:
                - paragraph [ref=e1105] [cursor=pointer]: Do you make custom invites ?
                - paragraph [ref=e1108]: No - We don’t make custom invites. Please tap the link in bio to buy a template of your choice.
              - generic [ref=e1113]:
                - paragraph [ref=e1119] [cursor=pointer]: Can I re-sell these template ?
                - paragraph [ref=e1122]: No - These templates are protected under applicable copyright and intellectual property laws. Any unauthorized use, including but not limited to reselling, redistributing, sublicensing, copying, sharing, reverse-engineering, or modifying these templates, in whole or in part, is strictly prohibited. Any violation will be treated as a serious infringement and may result in immediate legal action, including but not limited to civil and criminal proceedings, monetary damages, statutory penalties, injunctive relief, and recovery of legal costs. We actively monitor misuse and enforce our rights to the fullest extent permitted by law.
              - generic [ref=e1127]:
                - paragraph [ref=e1133] [cursor=pointer]: What's the refund policy ?
                - paragraph [ref=e1136]: Because this is a digital product, all sales are final and non-refundable. Please review the details carefully before purchasing. If you have any questions, feel free to contact us before placing your order.
